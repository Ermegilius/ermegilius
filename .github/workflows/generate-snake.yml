name: Generate Snake

on:
  schedule:
    # Runs at 12am and 12pm UTC every day
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Generate the snake animation
        uses: Platane/snk@v2
        with:
          github_user_name: Ermegilius
          output: dist/github-contribution-grid-snake.svg

      - name: Push the snake animation to the output branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          branch: output
          file: dist/github-contribution-grid-snake.svg
